<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="format-detection" content="telephone=no">
	<meta name="theme-color" content="#000000">
	<link rel="manifest" href="manifest.json">
	<title>全力オヤジ祭り 会計管理システム</title>
<style>
    :root {
        --bg-color: #050505;
        --accent-color: #0A84FF;
        --text-main: #F2F2F7;
        --text-sub: #8E8E93;
        --success-color: #34C759; /* iOSシステムグリーン */
        --expense-color: #FF453A; /* iOSシステムレッド */
    }
    *, *::before, *::after { box-sizing: border-box; }
    
    html, body {
        margin: 0; padding: 0; width: 100%; min-height: 100dvh; 
        background:
        	radial-gradient(circle at left top, rgba(0,80,0,.55), transparent 10%),
	        radial-gradient(circle at right top, rgba(120,0,0,.55), transparent 10%),
	        #000;
		color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        overflow-x: hidden;
    }

    /* ヘッダーを曇りガラス風に修正 */
    header {
        position: fixed; top: 0; left: 0; width: 100%;
        padding-top: env(safe-area-inset-top); 
        padding-bottom: 10px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    h2 {
        margin: 10px 0 0 0; font-size: 1.1rem; font-weight: 700;
        text-align: center; text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
    }
    #pageContainer {
        padding: calc(56px + env(safe-area-inset-top)) 4px 20px 4px;
        display: flex; flex-direction: column; align-items: center; width: 100%;
		background: transparent;
    }
    
    .card {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0; width: 100%; max-width: 540px;
    }
    
    .list-container { 
        width: 100%; 
        display: grid; 
        grid-template-columns: repeat(2, 1fr); 
        gap: 5px; 
    }
    
    /* ガラス/リキッド調カード */
    .member-card {
        display: flex; align-items: center; justify-content: space-between;
        background: rgba(255, 255, 255, 0.07); 
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 10px; 
        padding: 4px 5px 4px 5px; 
        height: 52px;    
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .member-card.paid {
        border-color: rgba(52, 199, 89, 0.5);
        background: rgba(52, 199, 89, 0.15);
        box-shadow: 0 4px 15px rgba(52, 199, 89, 0.15);
    }
    .member-detail { 
        display: flex; flex-direction: column; gap: 0px; 
        overflow: hidden; white-space: nowrap; text-overflow: ellipsis; 
        flex-grow: 1;
        padding-right: 4px;
    }
    .member-name { font-size: 14px; font-weight: 600; color: #FFFFFF; }
    
    .payment-select {
        background-color: rgba(255, 255, 255, 0.10);
        color: var(--text-main);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border-radius: 6px;
        padding: 8px 3px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        outline: none;
        max-width: 94px;
        transition: all 0.2s ease;
    }
    .payment-select option {
        background-color: #1C1C1E;
        color: #FFFFFF;
    }
    .member-card.paid .payment-select {
        border-color: rgba(52, 199, 89, 0.4);
        background-color: rgba(52, 199, 89, 0.25);
    }
    
    .summary-box {
        display: flex; justify-content: center; margin-bottom: 12px;
        font-size: 14px; color: var(--text-sub);
        padding-bottom: 6px;
    }
    .summary-item span { color: var(--text-main); font-weight: bold; font-size: 18px; }
    .error-msg { color: #FF453A; text-align: center; margin-top: 20px; }

    /* --- 収支計算エリアスタイル --- */
    .balance-container {
        margin-top: 20px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .balance-card {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 12px;
        padding: 14px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .balance-title {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .balance-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
    }
    .balance-table td {
        padding: 6px 0;
        color: var(--text-main);
    }
    .balance-table tr:not(:last-child) td {
        border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .balance-table .num-col {
        text-align: right;
        font-weight: 600;
        white-space: nowrap;
    }
    
    /* 入力フォームデザイン（ガラス調） */
    .num-input {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #FFFFFF;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 13px;
        text-align: right;
        width: 90px;
        outline: none;
    }
    .num-input:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 5px rgba(10, 132, 255, 0.5);
    }

    .total-income { color: var(--success-color); }
    .total-expense { color: var(--expense-color); }
    
    /* 当日収支カード */
    .net-balance-card {
        background: rgba(10, 132, 255, 0.12);
        border: 1px solid rgba(10, 132, 255, 0.4);
    }
    .net-balance-val {
        font-size: 20px;
        font-weight: 800;
        color: var(--accent-color);
    }
</style>

</head>
<body>
<header>
	<h2>会計管理</h2>
</header>

<div id="pageContainer">
    <div class="card">
        <div class="summary-box">
            <div class="summary-item">入金済: <span id="paidCount" style="color: var(--success-color);">0</span> 名</div>
        </div>
        <div id="errorArea" class="error-msg" style="display: none;">参加者データが見つかりません。QRコードを正しくスキャンしてください。</div>
        <div id="memberList" class="list-container">
            <!-- JavaScriptでここに動的にリストを生成 -->
        </div>

        <!-- 収支計算エリア -->
        <div class="balance-container">
            <!-- ■ 参加費設定 -->
            <div class="balance-card" style="padding: 12px 14px;">
                <div class="balance-title" style="margin-bottom: 0; padding-bottom: 0; border-bottom: none;">
                    <span>■ 参加費（1名あたり）</span>
                    <div>
                        <input type="number" id="feeInput" class="num-input" value="2000" step="100"> 円
                    </div>
                </div>
            </div>

            <!-- ■ 収入 -->
            <div class="balance-card">
                <div class="balance-title">
                    <span>■ 収入</span>
                    <span id="totalIncomeVal" class="total-income">¥0</span>
                </div>
                <table class="balance-table">
                    <tr>
                        <td>集金（現金）：<span id="cntCash">0</span>名</td>
                        <td id="valCash" class="num-col">¥0</td>
                    </tr>
                    <tr>
                        <td>集金（PayPay）：<span id="cntPaypay">0</span>名</td>
                        <td id="valPaypay" class="num-col">¥0</td>
                    </tr>
                    <tr>
                        <td>オヤジ券買取：<span id="cntTicket1000">0</span>枚（-¥1,000）</td>
                        <td id="valTicket1000" class="num-col">¥0</td>
                    </tr>
                    <tr>
                        <td>ワンコイン買取：<span id="cntTicket500">0</span>枚（-¥500）</td>
                        <td id="valTicket500" class="num-col">¥0</td>
                    </tr>
                </table>
            </div>

            <!-- ■ 支出 -->
            <div class="balance-card">
                <div class="balance-title">
                    <span>■ 支出</span>
                    <span id="totalExpenseVal" class="total-expense">¥36,300</span>
                </div>
                <table class="balance-table">
                    <tr>
                        <td>コート代（ビブス1セット含む）</td>
                        <td class="num-col"><input type="number" id="expCourt" class="num-input" value="36300" step="100"> 円</td>
                    </tr>
                    <tr>
                        <td>ビブス代（2セット）</td>
                        <td class="num-col"><input type="number" id="expBibs" class="num-input" value="0" step="100"> 円</td>
                    </tr>
                    <tr>
                        <td>その他</td>
                        <td class="num-col"><input type="number" id="expOther" class="num-input" value="0" step="100"> 円</td>
                    </tr>
                </table>
            </div>

            <!-- ■ 当日収支 -->
            <div class="balance-card net-balance-card">
                <div class="balance-title" style="margin-bottom:0; border-bottom:none;">
                    <span>■ 当日収支</span>
                    <span id="netBalanceVal" class="net-balance-val">¥0</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let globalMemberData = [];

    // URLの「data=」以降の生文字列を取得（ストレージのユニークキーに使用）
    function getRawDataString() {
        const href = window.location.href;
        const dataIndex = href.indexOf('data=');
        return dataIndex !== -1 ? href.substring(dataIndex + 5) : '';
    }

    // 1. URLパラメータからデータを抽出してデコード
    function getParams() {
        try {
            const href = window.location.href;
            const dataIndex = href.indexOf('data=');
            if (dataIndex === -1) return null;
            
            let rawData = href.substring(dataIndex + 5); 
            
            while (rawData.includes('%')) {
                rawData = decodeURIComponent(rawData);
            }
            
            rawData = rawData.replace(/ /g, '+');
            
            while (rawData.length % 4 !== 0) {
                rawData += '=';
            }
            
            const binaryStr = atob(rawData);
            const len = binaryStr.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }

            const decoder = new TextDecoder('utf-8');
            const jsonStr = decoder.decode(bytes);

            return JSON.parse(jsonStr);
        } catch (e) {
            console.error("データデコードエラー:", e);
            return null;
        }
    }

    // 2. 収支・金額の動的計算＆表示更新
    function calculateBalance() {
        const fee = Number(document.getElementById('feeInput').value) || 0;

        let countCash = 0;
        let countPaypay = 0;
        let countTicket1000 = 0;
        let countTicket500 = 0;
        let paidCount = 0;

        globalMemberData.forEach(m => {
            if (m.status === 'cash') countCash++;
            if (m.status === 'paypay') countPaypay++;
            if (m.status === 'ticket1000') countTicket1000++;
            if (m.status === 'ticket500') countTicket500++;
            if (m.status !== 'unpaid') paidCount++;
        });

        document.getElementById('paidCount').innerText = paidCount;

        const valCash = countCash * fee;
        const valPaypay = countPaypay * fee;
        const valTicket1000 = countTicket1000 * -1000;
        const valTicket500 = countTicket500 * -500;

        const totalIncome = valCash + valPaypay + valTicket1000 + valTicket500;

        document.getElementById('cntCash').innerText = countCash;
        document.getElementById('valCash').innerText = `¥${valCash.toLocaleString()}`;

        document.getElementById('cntPaypay').innerText = countPaypay;
        document.getElementById('valPaypay').innerText = `¥${valPaypay.toLocaleString()}`;

        document.getElementById('cntTicket1000').innerText = countTicket1000;
        document.getElementById('valTicket1000').innerText = `¥${valTicket1000.toLocaleString()}`;

        document.getElementById('cntTicket500').innerText = countTicket500;
        document.getElementById('valTicket500').innerText = `¥${valTicket500.toLocaleString()}`;

        document.getElementById('totalIncomeVal').innerText = `¥${totalIncome.toLocaleString()}`;

        const expCourt = Number(document.getElementById('expCourt').value) || 0;
        const expBibs = Number(document.getElementById('expBibs').value) || 0;
        const expOther = Number(document.getElementById('expOther').value) || 0;

        const totalExpense = expCourt + expBibs + expOther;
        document.getElementById('totalExpenseVal').innerText = `¥${totalExpense.toLocaleString()}`;

        const netBalance = totalIncome - totalExpense;
        const netEl = document.getElementById('netBalanceVal');
        
        if (netBalance > 0) {
            netEl.innerText = `+¥${netBalance.toLocaleString()}`;
            netEl.style.color = "var(--accent-color)";
        } else if (netBalance < 0) {
            netEl.innerText = `-¥${Math.abs(netBalance).toLocaleString()}`;
            netEl.style.color = "var(--expense-color)";
        } else {
            netEl.innerText = `¥0`;
            netEl.style.color = "var(--text-main)";
        }
    }

    // 3. メイン実行ロジック
    window.addEventListener('DOMContentLoaded', () => {
        globalMemberData = getParams() || [];
        const listContainer = document.getElementById('memberList');
        const errorArea = document.getElementById('errorArea');

        if (!globalMemberData || globalMemberData.length === 0) {
            errorArea.style.display = 'block';
            return;
        }

        // メンバーリストを「あいうえお順（50音順）」にソート
        globalMemberData.sort((a, b) => {
            const nameA = a.name || '';
            const nameB = b.name || '';
            return nameA.localeCompare(nameB, 'ja');
        });

        // リロード対策：localStorageから保存データを読み込む
        const rawDataKey = getRawDataString();
        const localStorageKey = `payment_status_${rawDataKey}`;
        let savedStatuses = {};
        
        try {
            const savedData = localStorage.getItem(localStorageKey);
            if (savedData) {
                savedStatuses = JSON.parse(savedData);
            }
        } catch (e) {
            console.error("ストレージの読み込みに失敗しました:", e);
        }

        // 初期ステータス設定（名前を固有キーにして保存ステータスを紐付け）
        globalMemberData.forEach((m) => {
            const memberKey = m.name || 'unknown';
            if (savedStatuses[memberKey] !== undefined) {
                m.status = savedStatuses[memberKey];
            } else {
                m.status = 'unpaid';
            }
        });

        // メンバーリスト描画
        globalMemberData.forEach((member) => {
            const card = document.createElement('div');
            card.className = 'member-card';
            
            if (member.status !== 'unpaid') {
                card.classList.add('paid');
            }

            card.innerHTML = `
                <div class="member-detail">
                    <span class="member-name">${member.name || '不明'}</span>
                </div>
                <select class="payment-select">
                    <option value="unpaid">未払い</option>
                    <option value="cash">現金</option>
                    <option value="paypay">PayPay</option>
                    <option value="ticket1000">オヤジ券1000</option>
                    <option value="ticket500">オヤジ券500</option>
                </select>
            `;

            listContainer.appendChild(card);

            const select = card.querySelector('.payment-select');
            select.value = member.status;

            // ステータス変更時の処理
            select.addEventListener('change', (e) => {
                const selectedValue = e.target.value;
                member.status = selectedValue;
                
                if (selectedValue !== 'unpaid') {
                    card.classList.add('paid');
                } else {
                    card.classList.remove('paid');
                }
                
                calculateBalance();

                // メンバーの名前をキーにして保存（並び替えが起こってもデータがずれないように補正）
                const memberKey = member.name || 'unknown';
                savedStatuses[memberKey] = selectedValue;
                try {
                    localStorage.setItem(localStorageKey, JSON.stringify(savedStatuses));
                } catch (err) {
                    console.error("ストレージへの保存に失敗しました:", err);
                }
            });
        });

        // 入力フォームの数値変更時にもリアルタイムで再計算
        document.getElementById('feeInput').addEventListener('input', calculateBalance);
        document.getElementById('expCourt').addEventListener('input', calculateBalance);
        document.getElementById('expBibs').addEventListener('input', calculateBalance);
        document.getElementById('expOther').addEventListener('input', calculateBalance);

        // 初回計算の実行
        calculateBalance();
    });
</script>
</body>
</html>
